name: Static checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build under a repository subpath
        run: npm run build
        env:
          PAGES_BASE: /kev-webgpu/
          APP_REVISION: ${{ github.sha }}
      - name: Ensure weights are not shipped in Pages
        shell: bash
        run: |
          if find dist -type f \( -name '*.onnx' -o -name '*.onnx.data*' -o -name '*.safetensors' \) | grep -q .; then
            echo 'Model weights must stay outside the Pages artifact'; exit 1
          fi
          test "$(du -sb dist | cut -f1)" -lt 1000000000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-build
          path: dist
          retention-days: 7
# This is deliberately a static/unit job. It neither downloads model weights nor
# claims GPU, numerical parity, real-model domain accuracy, or Pages-origin CORS.
