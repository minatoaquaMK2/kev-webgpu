name: Publish static Pages (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build static site with Pages base path
        run: npm run build
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
      - name: Reject bundled model weights
        shell: bash
        run: |
          if find dist -type f \( -name '*.onnx' -o -name '*.onnx.data*' -o -name '*.safetensors' \) | grep -q .; then exit 1; fi
          test "$(du -sb dist | cut -f1)" -lt 1000000000
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
# This workflow is provided but has not been dispatched by the implementation.
# Repository owners should configure environment protection before authorizing it.
